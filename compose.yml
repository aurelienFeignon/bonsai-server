name: bonsai-server
services:
  bonsai:
    image: bonsai-server:local
    build:
      context: .
      args:
        CUDA_BASE_IMAGE: ${CUDA_BASE_IMAGE:-nvidia/cuda:12.8.1-runtime-ubuntu24.04}
        LLAMA_RELEASE: ${LLAMA_RELEASE:-prism-b10777-e3de715}
        LLAMA_CUDA_VERSION: ${LLAMA_CUDA_VERSION:-12.8}
        LLAMA_ARCHIVE_SHA256: ${LLAMA_ARCHIVE_SHA256:-aa53e2256276e683386effdc8be34b3bd1cdf64ef9dc5d492da69227ac52531b}
    init: true
    restart: unless-stopped
    environment:
      LLAMA_API_KEY: ${BONSAI_API_KEY:?Run python3 scripts/setup.py first}
      MODEL_FILE: "${MODEL_FILE:-Bonsai-27B-Q1_0.gguf}"
      BONSAI_MODEL_ALIAS: "${BONSAI_MODEL_ALIAS:-bonsai-27b-q1}"
      BONSAI_CTX_SIZE: "${BONSAI_CTX_SIZE:-4096}"
      BONSAI_PARALLEL: "${BONSAI_PARALLEL:-1}"
      BONSAI_GPU_LAYERS: "${BONSAI_GPU_LAYERS:-999}"
      BONSAI_BATCH_SIZE: "${BONSAI_BATCH_SIZE:-128}"
      BONSAI_UBATCH_SIZE: "${BONSAI_UBATCH_SIZE:-128}"
      BONSAI_THREADS: "${BONSAI_THREADS:-4}"
      BONSAI_FLASH_ATTN: "${BONSAI_FLASH_ATTN:-on}"
      BONSAI_CACHE_TYPE_K: "${BONSAI_CACHE_TYPE_K:-f16}"
      BONSAI_CACHE_TYPE_V: "${BONSAI_CACHE_TYPE_V:-f16}"
      BONSAI_JINJA: "${BONSAI_JINJA:-false}"
      BONSAI_CHAT_TEMPLATE: "${BONSAI_CHAT_TEMPLATE:-chatml}"
      BONSAI_REASONING: "${BONSAI_REASONING:-off}"
      BONSAI_REASONING_BUDGET: "${BONSAI_REASONING_BUDGET:-0}"
      BONSAI_REASONING_FORMAT: "${BONSAI_REASONING_FORMAT:-deepseek}"
      BONSAI_CONTEXT_SHIFT: "${BONSAI_CONTEXT_SHIFT:-false}"
      BONSAI_CORS_ORIGINS: "${BONSAI_CORS_ORIGINS:-localhost}"
      BONSAI_TEMPERATURE: "${BONSAI_TEMPERATURE:-0.1}"
      BONSAI_TOP_P: "${BONSAI_TOP_P:-0.95}"
      BONSAI_TOP_K: "${BONSAI_TOP_K:-20}"
      BONSAI_MIN_P: "${BONSAI_MIN_P:-0.05}"
      BONSAI_MAX_TOKENS: "${BONSAI_MAX_TOKENS:-600}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BONSAI_GPU_ID:-0}"]
              capabilities: [gpu]
    cpus: ${BONSAI_CPU_LIMIT:-4}
    mem_limit: ${BONSAI_RAM_LIMIT:-8g}
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    ports:
      - "${BONSAI_BIND:-127.0.0.1}:${BONSAI_PORT:-53110}:53110"
    networks:
      llm:
        aliases: [bonsai]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:53110/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5m
networks:
  llm:
    name: ${BONSAI_NETWORK:-bonsai-llm}
